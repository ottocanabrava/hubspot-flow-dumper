<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Segoe UI, system-ui, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #1e1e1e;
      color: #f5f5f5;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    p {
      font-size: 12px;
      color: #aaa;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #ff7a59;
      color: #111;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #8fd19e;
      white-space: pre-wrap;
      min-height: 1.2em;
    }
    #status.err {
      color: #ff8a8a;
    }
  </style>
</head>
<body>
  <h1>HubSpot Flow Dumper</h1>
  <p>Abra o editor do workflow e clique abaixo. Baixa JSON, summary e códigos.</p>
  <button id="dump">Dump deste workflow</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
